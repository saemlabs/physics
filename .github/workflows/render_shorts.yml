name: Bulk Render Physics Shorts

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', 'LICENSE']
  workflow_dispatch:
    inputs:
      retries:
        description: 'Number of retries per video on failure'
        required: false
        default: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1 — Fast structural validation using standard Python library
  # ------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight File Existence Check
        run: |
          test -f content_batch.csv       || { echo "::error::content_batch.csv missing"; exit 1; }
          test -f saem_voice_sample.wav   || { echo "::error::saem_voice_sample.wav missing"; exit 1; }
          test -f render_universal.py     || { echo "::error::render_universal.py missing"; exit 1; }
          test -f batch_runner.py         || { echo "::error::batch_runner.py missing"; exit 1; }
          test -f generate_audio.py       || { echo "::error::generate_audio.py missing"; exit 1; }

      - name: Validate CSV & JSON Integrity
        run: |
          python3 -c "
          import csv, json, sys

          with open('content_batch.csv', mode='r', encoding='utf-8') as f:
              reader = list(csv.DictReader(f))
              if not reader:
                  print('::error::content_batch.csv is empty'); sys.exit(1)
              
              req_headers = {'video_id', 'concept_type', 'header_title', 'equations_json', 'visual_data_json', 'audio_script'}
              missing = req_headers - set(reader[0].keys())
              if missing:
                  print(f'::error::Missing required headers: {missing}'); sys.exit(1)

              for idx, row in enumerate(reader, 1):
                  vid = row.get('video_id', f'row_{idx}')
                  for col in ('equations_json', 'visual_data_json'):
                      val = row.get(col, '')
                      if val:
                          try:
                              parsed = json.loads(val)
                              if isinstance(parsed, str): json.loads(parsed)
                          except Exception as e:
                              print(f'::error::Row {idx} ({vid}) column {col} invalid JSON: {e}')
                              sys.exit(1)
          print('CSV and JSON structures validated successfully!')
          "

  # ------------------------------------------------------------------
  # Job 2 — Parallel matrix rendering across 4 CPU shards (Python 3.11)
  # ------------------------------------------------------------------
  batch_render:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]     # 4 parallel workers
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          echo "::group::Installing LaTeX and FFmpeg System Packages"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ffmpeg \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science \
            texlive-fonts-recommended dvisvgm \
            libcairo2-dev libpango1.0-dev libsndfile1
          echo "::endgroup::"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch CPU & Python requirements
        run: |
          echo "::group::Installing Python Dependencies & PyTorch CPU"
          python -m pip install --upgrade "pip<24.1"
          pip install --prefer-binary -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          echo "::endgroup::"

      - name: Cache AI model weights (XTTS-v2)
        id: model_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/tts
          key: ai-models-xtts-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run batch render (Chunk ${{ matrix.chunk }}/${{ strategy.job-total }})
        env:
          COQUI_TOS_AGREED: "1"
          MANIM_VERBOSE: "1"
        run: |
          mkdir -p output_shorts
          python batch_runner.py \
            --chunk ${{ matrix.chunk }} \
            --total-chunks ${{ strategy.job-total }} \
            --retries ${{ inputs.retries || '2' }} \
            --log-file output_shorts/runlog_${{ matrix.chunk }}.json

      - name: Upload rendered shorts (Chunk ${{ matrix.chunk }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-shorts-chunk-${{ matrix.chunk }}-${{ github.run_id }}
          path: output_shorts/*.mp4
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 3 — Enhanced Summary Generation ($GITHUB_STEP_SUMMARY)
  # ------------------------------------------------------------------
  merge_artifacts:
    needs: batch_render
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all render chunks
        uses: actions/download-artifact@v4
        with:
          pattern: physics-shorts-chunk-*
          merge-multiple: true
          path: merged

      - name: Flatten files & generate rich job summary
        run: |
          mkdir -p final_mp4s
          find merged -type f -name "*.mp4" -exec mv {} final_mp4s/ \;
          
          TOTAL_COUNT=$(find final_mp4s -name '*.mp4' | wc -l)
          TOTAL_SIZE=$(du -sh final_mp4s 2>/devnull | cut -f1 || echo "0B")

          if [ "$TOTAL_COUNT" -gt 0 ]; then
            cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🎬 Physics Shorts Production Summary

          > **Status:** Successfully generated **$TOTAL_COUNT video(s)** ($TOTAL_SIZE total storage)

          ### 📦 Generated Render Output Table

          | Video ID / Filename | Resolution | File Size |
          | :--- | :---: | :---: |
          EOF

            find final_mp4s -name '*.mp4' -printf '%f\t%s\n' | while IFS=$'\t' read -r fname fbytes; do
              MB=$(awk "BEGIN {printf \"\%.2f\", $fbytes/1048576}")
              echo "| \`$fname\` | 1080x1920 (9:16) | **${MB} MB** |" >> $GITHUB_STEP_SUMMARY
            done

          else
            cat << EOF >> $GITHUB_STEP_SUMMARY
          # ⚠️ Physics Shorts Production Summary

          > **Status:** No MP4 files were generated in this run.

          Check job logs for potential LaTeX compilation errors or Coqui TTS synthesis timeouts.
          EOF
            echo "::error title=Render Output Empty::No MP4 video files were produced during this execution run."
          fi

      - name: Upload final merged bundle
        uses: actions/upload-artifact@v4
        with:
          name: physics-shorts-final-${{ github.run_id }}
          path: final_mp4s/*.mp4
          if-no-files-found: warn
          retention-days: 7
