<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Visual Concepts & PYQs | Saem Physics Lab</title>
    <style>
        :root {
            --bg-color: #0B0C10;
            --card-bg: #15161D;
            --card-border: #232530;
            --accent-gold: #F1C40F;
            --accent-blue: #3498DB;
            --accent-green: #2ECC71;
            --text-main: #FFFFFF;
            --text-muted: #9A9B9E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px;
        }

        /* HEADER SECTION */
        header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 1.8rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* SEARCH & FILTER BAR */
        .controls {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-blue);
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tag-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tag-btn.active, .tag-btn:hover {
            background: var(--accent-blue);
            color: var(--text-main);
            border-color: var(--accent-blue);
        }

        /* VIDEO GRID (VERTICAL 9:16 ASPECT RATIO) */
        .video-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 177.78%; /* 9:16 Vertical Aspect Ratio */
            background: #000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-gold);
        }

        .card-tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .topic-badge {
            background: rgba(52, 152, 219, 0.15);
            color: var(--accent-blue);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .download-link {
            color: var(--accent-green);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        /* EMPTY STATE */
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Physics Visual Concepts & PYQs</h1>
        <p>3Blue1Brown-style animated concept shorts & past year question solutions for JEE/NEET candidates.</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Search physics concepts, formulas, or topics...">
        <div class="filter-tags">
            <button class="tag-btn active" onclick="filterCategory('ALL')">All Shorts</button>
            <button class="tag-btn" onclick="filterCategory('Electrostatics')">Electrostatics</button>
            <button class="tag-btn" onclick="filterCategory('Kinematics')">Kinematics</button>
            <button class="tag-btn" onclick="filterCategory('Magnetism')">Magnetism</button>
            <button class="tag-btn" onclick="filterCategory('PYQ')">PYQ Solutions</button>
        </div>
    </div>

    <main class="video-grid" id="videoGrid"></main>

    <script>
        // =========================================================================
        // ADD YOUR GENERATED VIDEO MP4 PATHS & DETAILS HERE
        // =========================================================================
        const videoData = [
            {
                id: "dipole_01",
                title: "Torque on Electric Dipole",
                tagline: "Restoring Torque & Angular SHM",
                topic: "Electrostatics",
                videoPath: "output_shorts/dipole_01_final.mp4"
            },
            {
                id: "proj_01",
                title: "Projectile Motion Trajectory",
                tagline: "Parabolic Trajectory & Range Derivation",
                topic: "Kinematics",
                videoPath: "output_shorts/proj_01_final.mp4"
            },
            {
                id: "lorentz_01",
                title: "Lorentz Force Deflection",
                tagline: "Circular Motion in Uniform Magnetic Field",
                topic: "Magnetism",
                videoPath: "output_shorts/lorentz_01_final.mp4"
            },
            {
                id: "pyq_01",
                title: "Gauss Law & Closed Flux",
                tagline: "JEE Advanced Electrostatics PYQ",
                topic: "PYQ",
                videoPath: "output_shorts/pyq_01_final.mp4"
            }
        ];

        let activeCategory = 'ALL';

        function renderGrid(data) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = '<div class="no-results">No physics shorts found matching your search.</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <video controls preload="metadata" playsinline>
                            <source src="${item.videoPath}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                    <div class="card-details">
                        <div class="card-title">${item.title}</div>
                        <div class="card-tagline">${item.tagline}</div>
                        <div class="card-meta">
                            <span class="topic-badge">${item.topic}</span>
                            <a href="${item.videoPath}" download class="download-link">Download MP4</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            activeCategory = category;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().toLowerCase().includes(category.toLowerCase()) || (category === 'ALL' && btn.textContent.includes('All')));
            });
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videoData.filter(item => {
                const matchesCategory = activeCategory === 'ALL' || item.topic.toLowerCase() === activeCategory.toLowerCase();
                const matchesQuery = item.title.toLowerCase().includes(query) || 
                                     item.tagline.toLowerCase().includes(query) || 
                                     item.topic.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
            renderGrid(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Initial Render
        renderGrid(videoData);
    </script>
</body>
</html>
